name: Publish NeoLearning

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: neoweb-pages
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify publication prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - name: Require the protected default workflow and configured Pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          HAS_SOURCE_TOKEN: ${{ secrets.NEOLEARNING_READ_TOKEN != '' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const errors = [];
          const expectedRef = 'refs/heads/' + process.env.DEFAULT_BRANCH;
          const expectedWorkflow = process.env.GITHUB_REPOSITORY + '/.github/workflows/pages.yml@' + expectedRef;
          if (process.env.GITHUB_REPOSITORY !== 'NeoTech-vietnam/NeoWeb') {
            errors.push('This publication workflow is restricted to NeoTech-vietnam/NeoWeb.');
          }
          if (process.env.GITHUB_REF !== expectedRef || process.env.WORKFLOW_REF !== expectedWorkflow) {
            errors.push('Run pages.yml from the repository default branch; feature-branch workflows cannot publish.');
          }
          if (process.env.REF_PROTECTED !== 'true') {
            errors.push('Protect the default branch before enabling the self-hosted publication job. See docs/deployment.md.');
          }
          if (process.env.HAS_SOURCE_TOKEN !== 'true') {
            errors.push('Configure NEOLEARNING_READ_TOKEN with read access to NeoLearning and every private nested example repository.');
          }
          const response = await fetch('https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + '/pages', {
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: 'Bearer ' + process.env.GH_TOKEN,
              'X-GitHub-Api-Version': '2022-11-28',
            },
          });
          if (!response.ok) {
            errors.push('GitHub Pages is unavailable or not configured (HTTP ' + response.status + '). Select GitHub Actions as the Pages source; private organization repositories require an eligible paid plan.');
          } else {
            const site = await response.json();
            if (site.build_type !== 'workflow') errors.push('Select GitHub Actions as the Pages build source.');
            if (site.public === false) errors.push('The requested learning portal must use public Pages visibility.');
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            errors.length ? 'Publication prerequisites are incomplete:\n\n' + errors.map(error => '- ' + error).join('\n') + '\n' :
            'Publication prerequisites passed. The dedicated runner may build the protected default-branch revision.\n');
          for (const error of errors) console.error('::error::' + error);
          if (errors.length) process.exitCode = 1;
          NODE

  build:
    name: Build immutable learning snapshots
    needs: preflight
    if: >-
      github.repository == 'NeoTech-vietnam/NeoWeb' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.ref_protected &&
      github.workflow_ref == format('{0}/.github/workflows/pages.yml@refs/heads/{1}', github.repository, github.event.repository.default_branch)
    runs-on: [self-hosted, neoweb-content]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out the trusted website revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check out source and exact nested example pins
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: NeoTech-vietnam/NeoLearning
          ref: dev
          path: .content/NeoLearning
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.NEOLEARNING_READ_TOKEN }}
          persist-credentials: false

      - name: Install locked website dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Test the compiler and learning behavior
        run: npm test

      - name: Generate published snapshots
        run: npm run content:build -- --source ../.content/NeoLearning
        env:
          NEOLEARNING_READ_TOKEN: ${{ secrets.NEOLEARNING_READ_TOKEN }}

      - name: Export static HTML and browser assets
        run: npm run build
        env:
          NEOWEB_BASE_PATH: /${{ github.event.repository.name }}

      - name: Verify the export and 750 MB artifact limit
        run: npm run artifact:check

      - name: Upload the verified Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: web/dist/client
          retention-days: 1

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
